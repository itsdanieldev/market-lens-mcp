name: Release

# v0.1.0 같은 태그를 푸시하면 PyPI에 배포한다.
# PyPI의 Trusted Publishing(OIDC)을 써서 저장소에 토큰을 저장하지 않는다.
# 사전 준비: PyPI에서 이 저장소, 이 워크플로(release.yml), 환경(pypi)을 신뢰할 게시자로 등록한다.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: 태그와 패키지 버전이 같은지 확인
        run: |
          version="$(uv run python -c 'import market_lens; print(market_lens.__version__)')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "태그 ${GITHUB_REF_NAME}와 패키지 버전 ${version}이 다릅니다." >&2
            exit 1
          fi
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Trusted Publishing에 필요한 OIDC 토큰
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
